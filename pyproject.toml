[project]
name = "sylc-3d-player"
version = "5.0.1"
description = "SyLC 3D MVC Stereoscopic Video Player"
requires-python = "==3.14.*"
dependencies = [
    "pyside6>=6.6.0",
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "python-mpv>=1.0.4",
    "pyopengl>=3.1.7",
]

[tool.pytest.ini_options]
# The workspace contains archived release/source snapshots (GitHub_v*, build_*).
# Only the canonical test tree must be collected, otherwise pytest imports the
# same Qt integration scripts multiple times and Qt aborts the process.
testpaths = ["tests"]
